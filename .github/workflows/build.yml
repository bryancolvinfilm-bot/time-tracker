name: Build and release desktop apps

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full main commit to build and verify
        required: true
        type: string
      publish_release:
        description: Publish verified packages as the latest GitHub Release
        default: false
        type: boolean
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            architecture: x64
          - os: macos-latest
            target: mac
            architecture: universal
          - os: ubuntu-latest
            target: linux
            architecture: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify requested source commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ -n "$EXPECTED_SHA" && "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo 'The requested source commit does not match this checkout.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install Linux window manager
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openbox x11-utils
      - name: Verify desktop shell
        if: runner.os != 'Linux'
        run: npm test
      - name: Verify desktop shell on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" bash scripts/test-linux.sh
      - name: Package app
        run: npm run dist:${{ matrix.target }} -- --${{ matrix.architecture }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged Windows app
        if: runner.os == 'Windows'
        run: npm run test:desktop
        env:
          TIME_TRACKER_EXECUTABLE: ${{ github.workspace }}/release/win-unpacked/Time Tracker.exe
      - name: Verify Windows portable startup
        if: runner.os == 'Windows'
        run: npm run test:portable
      - name: Verify Mac package signatures and installed app
        if: runner.os == 'macOS'
        run: npm run test:mac
      - name: Verify Linux packages
        if: runner.os == 'Linux'
        run: bash scripts/test-linux-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Time-Tracker-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: publish-time-tracker
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: Time-Tracker-*
          merge-multiple: true
          path: release/downloads
      - name: Upload draft, verify every asset, and publish
        run: node scripts/release.cjs publish release/downloads
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
